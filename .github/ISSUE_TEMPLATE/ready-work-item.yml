name: Ready work item
description: Use this template for issues that should meet the Definition of Ready.
title: "[Area]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Fill out all required fields so the issue is ready for planning.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short, specific description of the work.
      placeholder: What should be implemented or changed?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the exact boundaries of this issue.
      placeholder: What is in scope, and what is not?
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List upstream work, assets, decisions, or issues this depends on.
      placeholder: |
        - #7 base map exists
        - Asset X is available
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be true for this issue to be complete.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: Rough effort estimate.
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context, constraints, or follow-up splits.
      placeholder: Add any extra context here.
