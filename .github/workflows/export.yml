name: Export Game

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  export:
    name: Export Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Export Windows
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: >
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: >
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: 'Windows Desktop'  
          archive_output: true                  #produce a .zip for the GitHub release
          create_release: true
          export_debug: false
          cache: true                           #caches the Godot binary between runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

