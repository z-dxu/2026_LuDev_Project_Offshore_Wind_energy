name: Export Game

on:
  push:
    tags:
      - 'v*'

jobs:
  export:
    name: Export Windows
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Export Windows
        run: |
          mkdir -v -p build/windows
          godot --headless --export-release \"Windows Desktop\" build/windows/game.exe

      - name: Archive Builds
        run: |
          apt-get update && apt-get install -y zip
          cd build/windows && zip -r ../../windows_build.zip . && cd ../..

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: \"*.zip\"
          token: ${{ secrets.GITHUB_TOKEN }}

