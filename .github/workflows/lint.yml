name: Lint and Format

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: GDScript Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install GDToolkit
        run: pip install "gdtoolkit==4.*"

      - name: Run GDFormat Check
        run: gdformat --check --diff .

      - name: Run GDLint Check
        run: gdlint .
