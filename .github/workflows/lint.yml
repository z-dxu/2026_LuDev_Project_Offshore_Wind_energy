name: Lint and Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   

jobs:
  lint:
    name: GDScript Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run GDFormat
        run: uvx --from 'gdtoolkit==4.*' gdformat Scripts/ Scenes/
        # No --check: this mutates files in place

      - name: Run GDLint 
        run: uvx --from 'gdtoolkit==4.*' gdlint .


      - name: Commit and push formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format GDScript via gdformat [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          file_pattern: "**/*.gd"
          # If no files changed, this step is a no-op — safe to always run
