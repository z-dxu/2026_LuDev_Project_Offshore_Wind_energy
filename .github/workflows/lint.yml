name: Lint and Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   

jobs:
  lint:
    name: GDScript Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run GDFormat
        run: uvx --from 'gdtoolkit==4.*' gdformat --check Scripts/ Scenes/
    
      - name: Run GDLint 
        run: uvx --from 'gdtoolkit==4.*' gdlint .


          # If no files changed, this step is a no-op — safe to always run
